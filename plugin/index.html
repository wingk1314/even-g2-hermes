<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="24x24" href="icon.png">
<title>Alita</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #111;
    color: #33ff33;
    width: 576px;
    height: 288px;
    overflow: hidden;
  }
  #debug {
    position: absolute;
    bottom: 4px;
    left: 12px;
    font-size: 11px;
    color: #33ff3344;
    max-width: 90%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<div id="debug">Init...</div>

<script type="module">
import {
  waitForEvenAppBridge,
  AudioInputSource,
  StartUpPageCreateResult,
} from './node_modules/@evenrealities/even_hub_sdk/dist/index.js';

// ── Config ──────────────────────────────────────────────────
const API_BASE = 'http://192.168.0.203:9191';
const MAX_CHARS = 280;

// Glasses: 576 x 288
// header (36px) + response (180px) + replies (64px)
const LAYOUT = {
  header:   { x: 16, y: 8,   w: 544, h: 32 },
  response: { x: 16, y: 48,  w: 544, h: 172 },
  replies:  { x: 16, y: 224, w: 544, h: 56 },
};

// ── State ──────────────────────────────────────────────────
let bridge = null;
let glassesReady = false;
let mode = 'boot'; // boot | start | chat
let selectedIndex = 0;
let startSelectedIndex = 0;
let replies = [];
let isProcessing = false;
let conversationHistory = [];
let sessionInfo = null;

const $ = id => document.getElementById(id);
function log(msg) { console.log('[Alita]', msg); $('debug').textContent = msg; }

// ── Glasses: Build Layout ──────────────────────────────────────
// Which container gets isEventCapture depends on current screen

function buildContainers(eventContainer) {
  return {
    containerTotalNum: 3,
    textObject: [
      {
        xPosition: LAYOUT.header.x,
        yPosition: LAYOUT.header.y,
        width: LAYOUT.header.w,
        height: LAYOUT.header.h,
        containerID: 1,
        containerName: 'header',
        content: '',
        isEventCapture: eventContainer === 1 ? 1 : 0,
      },
      {
        xPosition: LAYOUT.response.x,
        yPosition: LAYOUT.response.y,
        width: LAYOUT.response.w,
        height: LAYOUT.response.h,
        containerID: 2,
        containerName: 'response',
        content: '',
        isEventCapture: eventContainer === 2 ? 1 : 0,
      },
      {
        xPosition: LAYOUT.replies.x,
        yPosition: LAYOUT.replies.y,
        width: LAYOUT.replies.w,
        height: LAYOUT.replies.h,
        containerID: 3,
        containerName: 'replies',
        content: '',
        isEventCapture: eventContainer === 3 ? 1 : 0,
      },
    ],
  };
}

async function rebuildDisplay(eventContainer) {
  if (!bridge) return false;
  try {
    const result = await bridge.rebuildPageContainer(buildContainers(eventContainer));
    glassesReady = result === true || result === StartUpPageCreateResult.success;
    log('Rebuild (events→' + eventContainer + '): ' + (glassesReady ? 'OK' : 'FAIL'));
    return glassesReady;
  } catch (err) {
    log('Rebuild error: ' + err.message);
    return false;
  }
}

async function initGlassesDisplay() {
  if (!bridge) return false;
  try {
    const result = await bridge.createStartUpPageContainer(buildContainers(3));
    glassesReady = result === StartUpPageCreateResult.success;
    log('Glasses init: ' + (glassesReady ? 'OK' : 'FAIL'));
    return glassesReady;
  } catch (err) {
    log('Init error: ' + err.message);
    return false;
  }
}

// ── Glasses: Update Helpers ──────────────────────────────────────
async function push(containerID, containerName, content) {
  if (!bridge || !glassesReady) return;
  try {
    await bridge.textContainerUpgrade({ containerID, containerName, content });
  } catch (e) {
    log('Push error: ' + containerName);
  }
}

async function pushHeader(text) { await push(1, 'header', text); }
async function pushResponse(text) { await push(2, 'response', text); }
async function pushReplies() {
  const lines = replies.map((r, i) =>
    (i === selectedIndex ? '> ' : '  ') + r.text
  ).join('\n');
  await push(3, 'replies', lines);
}

// ── Init ──────────────────────────────────────────────────
async function init() {
  try {
    bridge = await waitForEvenAppBridge();
    log('Bridge OK');
    bridge.onEvenHubEvent(handleEvent);
    await initGlassesDisplay();
    await bootSequence();
  } catch (err) {
    log('Bridge fail: ' + err.message);
    await bootSequence();
  }
}

// ── Boot ──────────────────────────────────────────────────
async function bootSequence() {
  mode = 'boot';
  if (glassesReady) {
    await pushHeader('Alita');
    await pushResponse('Starting');
    await new Promise(r => setTimeout(r, 700));
    await pushResponse('Starting.');
    await new Promise(r => setTimeout(r, 700));
    await pushResponse('Starting..');
    await new Promise(r => setTimeout(r, 700));
    await pushResponse('Starting...');
    await new Promise(r => setTimeout(r, 500));
  }
  await fetchSessionInfo();
  showStartScreen();
}

// ── Session Info ──────────────────────────────────────────────
async function fetchSessionInfo() {
  try {
    const res = await fetch(API_BASE + '/session-info');
    if (res.ok) sessionInfo = await res.json();
  } catch {}
}

// ── Start Screen ──────────────────────────────────────────────
// Events go to container 2 (response area) where choices are
async function showStartScreen() {
  mode = 'start';
  startSelectedIndex = 0;

  if (glassesReady) {
    // Rebuild so container 2 captures events
    await rebuildDisplay(2);
    renderStartScreen();
  }
}

async function renderStartScreen() {
  const hint = sessionInfo?.lastTopic || '';
  const lines = [
    "Hi, I'm Alita",
    '',
    startSelectedIndex === 0 ? '> Continue' : '  Continue',
    hint ? '  ' + hint.slice(0, 40) : '',
    '',
    startSelectedIndex === 1 ? '> New conversation' : '  New conversation',
  ].join('\n');

  await pushHeader('Alita');
  await pushResponse(lines);
  await push(3, 'replies', ''); // clear replies
}

// ── Chat ──────────────────────────────────────────────────────
async function startChat(continueSession) {
  mode = 'chat';

  // Rebuild so container 3 (replies) captures events
  if (glassesReady) {
    await rebuildDisplay(3);
    await pushHeader('Alita');
    await pushResponse('Loading...');
    await pushReplies();
  }

  if (continueSession) {
    try {
      const res = await fetch(API_BASE + '/continue');
      if (res.ok) {
        const data = await res.json();
        conversationHistory = data.history || [];
        await showText(data.summary || 'Ready.');
        setRepliesFromData(data.replies);
      } else {
        await showText('Ready.');
        setDefaultReplies();
      }
    } catch {
      await showText('Ready.');
      setDefaultReplies();
    }
  } else {
    await showText('New conversation.');
    setDefaultReplies();
  }
  await pushReplies();
}

function setDefaultReplies() {
  setReplies([
    { text: 'Speak', action: 'speak' },
    { text: 'What can you do?', action: 'text', value: 'What can you do?' },
    { text: 'What time is it?', action: 'text', value: 'What time is it?' },
    { text: 'Calendar', action: 'text', value: "What's on my calendar today?" },
    { text: 'Help', action: 'text', value: 'Help me with something' },
  ]);
}

function setRepliesFromData(dataReplies) {
  if (dataReplies && dataReplies.length > 0) {
    setReplies([
      { text: 'Speak', action: 'speak' },
      ...dataReplies.map(r => ({ text: r, action: 'text', value: r })),
    ]);
  } else {
    setDefaultReplies();
  }
}

async function showText(text) {
  let display = text || '';
  if (display.length > MAX_CHARS) display = display.slice(0, MAX_CHARS) + '...';
  await pushResponse(display);
}

// ── Event Handler ──────────────────────────────────────────────
function handleEvent(event) {
  // System events (touchpad / ring gestures)
  if (event.sysEvent) {
    const et = event.sysEvent.eventType;

    if (mode === 'start') {
      if (et === 'swipe_up') {
        startSelectedIndex = Math.max(0, startSelectedIndex - 1);
        renderStartScreen();
      } else if (et === 'swipe_down') {
        startSelectedIndex = Math.min(1, startSelectedIndex + 1);
        renderStartScreen();
      } else if (et === 'tap' || et === 'press') {
        doStartSelect();
      }
      return;
    }

    if (mode === 'chat') {
      if (et === 'swipe_up') {
        moveSelection(-1);
      } else if (et === 'swipe_down') {
        moveSelection(1);
      } else if (et === 'tap' || et === 'press') {
        doReplySelect();
      }
      return;
    }
  }

  // List events (from SDK list container, if used)
  if (event.listEvent) {
    const { currentSelectItemIndex, eventType } = event.listEvent;
    if (mode === 'start') {
      startSelectedIndex = currentSelectItemIndex;
      renderStartScreen();
      if (eventType === 'click' || eventType === 'tap') doStartSelect();
    } else if (mode === 'chat') {
      selectedIndex = currentSelectItemIndex;
      pushReplies();
      if (eventType === 'click' || eventType === 'tap') doReplySelect();
    }
  }
}

function doStartSelect() {
  startChat(startSelectedIndex === 0);
}

function doReplySelect() {
  if (isProcessing) return;
  const reply = replies[selectedIndex];
  if (!reply) return;
  if (reply.action === 'speak') startListening();
  else if (reply.action === 'text') sendMessage(reply.value || reply.text);
}

// ── Navigation ──────────────────────────────────────────────
function moveSelection(dir) {
  if (isProcessing) return;
  selectedIndex = Math.max(0, Math.min(replies.length - 1, selectedIndex + dir));
  pushReplies();
}

// ── Voice ──────────────────────────────────────────────────
async function startListening() {
  if (!bridge) return;
  await showText('[ Listening... ]');

  try {
    await bridge.audioControl(true, AudioInputSource.Glasses);
    const chunks = [];
    const unsub = bridge.onEvenHubEvent(e => {
      if (e.audioEvent?.audioPcm) chunks.push(e.audioEvent.audioPcm);
    });

    setTimeout(async () => {
      unsub();
      await bridge.audioControl(false);
      if (chunks.length > 0) {
        const len = chunks.reduce((s, c) => s + c.length, 0);
        const buf = new Uint8Array(len);
        let off = 0;
        for (const c of chunks) { buf.set(c, off); off += c.length; }
        sendAudio(buf);
      } else {
        await showText('No audio.');
      }
    }, 10000);
  } catch (e) {
    log('MIC error: ' + e.message);
    await showText('MIC error.');
  }
}

// ── API ──────────────────────────────────────────────────
async function sendMessage(text) {
  if (isProcessing) return;
  isProcessing = true;
  await showText('Thinking...');
  conversationHistory.push({ role: 'user', content: text });

  try {
    const res = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: conversationHistory.slice(-10) }),
    });
    if (!res.ok) throw new Error('API ' + res.status);
    const data = await res.json();
    conversationHistory.push({ role: 'assistant', content: data.response });

    await showText(data.response);
    setRepliesFromData(data.replies);
    await pushReplies();
  } catch (e) {
    await showText('Error: ' + e.message);
  } finally {
    isProcessing = false;
  }
}

async function sendAudio(audioData) {
  if (isProcessing) return;
  isProcessing = true;
  try {
    const res = await fetch(API_BASE + '/transcribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: audioData,
    });
    if (!res.ok) throw new Error('Transcribe ' + res.status);
    const data = await res.json();
    if (data.text) sendMessage(data.text);
    else { await showText('No speech.'); isProcessing = false; }
  } catch {
    await showText('Transcribe error.');
    isProcessing = false;
  }
}

// ── Replies ──────────────────────────────────────────────────
function setReplies(list) {
  replies = list.slice(0, 5);
  selectedIndex = 0;
}

// ── Go ──────────────────────────────────────────────────
init();
</script>
</body>
</html>
