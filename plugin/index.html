<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="24x24" href="icon.png">
<title>Alita</title>
</head>
<body>
<script type="module">
import {
  waitForEvenAppBridge,
  AudioInputSource,
  StartUpPageCreateResult,
} from './node_modules/@evenrealities/even_hub_sdk/dist/index.js';

const API_BASE = 'http://192.168.0.203:9191';
const MAX = 400;

let bridge = null, ready = false, mode = 'boot';
let selIdx = 0, replies = [], processing = false;
let history = [], sessionInfo = null;
let lastEvt = ''; // show last event on screen for debugging

function trunc(s) { return (s || '').length > MAX ? s.slice(0, MAX) + '...' : s || ''; }

// ── ONE container — everything rendered as text ──────────────
async function createDisplay() {
  if (!bridge) return;
  try {
    const r = await bridge.createStartUpPageContainer({
      containerTotalNum: 1,
      textObject: [{
        xPosition: 16, yPosition: 8, width: 544, height: 272,
        containerID: 1, containerName: 'main',
        content: '',
        isEventCapture: 1,
      }],
    });
    ready = r === StartUpPageCreateResult.success;
  } catch {}
}

async function show(text) {
  if (!bridge || !ready) return;
  try { await bridge.textContainerUpgrade({ containerID: 1, containerName: 'main', content: text }); }
  catch {}
}

// ── Init ──────────────────────────────────────────────────
async function init() {
  try {
    bridge = await waitForEvenAppBridge();
    bridge.onEvenHubEvent(onEvent);
    await createDisplay();
    await boot();
  } catch {}
}

// ── Boot ──────────────────────────────────────────────────
async function boot() {
  mode = 'boot';
  await show('Alita\n\nStarting.');
  await new Promise(r => setTimeout(r, 800));
  await show('Alita\n\nStarting..');
  await new Promise(r => setTimeout(r, 800));
  await show('Alita\n\nStarting...');
  await new Promise(r => setTimeout(r, 600));

  try { const r = await fetch(API_BASE + '/session-info'); if (r.ok) sessionInfo = await r.json(); } catch {}

  showStart();
}

// ── Start Screen ──────────────────────────────────────────
function showStart() {
  mode = 'start';
  selIdx = 0;
  renderStart();
}

function renderStart() {
  const hint = sessionInfo?.lastTopic ? '(' + sessionInfo.lastTopic.slice(0, 30) + ')' : '';
  const lines = [
    "Hi, I'm Alita",
    '',
    selIdx === 0 ? '> Continue' : '  Continue',
    hint ? '  ' + hint : '',
    '',
    selIdx === 1 ? '> New conversation' : '  New conversation',
  ];
  show(lines.join('\n'));
}

// ── Chat ──────────────────────────────────────────────────
async function startChat(continued) {
  mode = 'chat';
  selIdx = 0;

  if (continued) {
    await show('Loading...');
    try {
      const r = await fetch(API_BASE + '/continue');
      if (r.ok) {
        const d = await r.json();
        history = d.history || [];
        await show(trunc(d.summary || 'Ready.'));
        makeReplies(d.replies);
      } else { await show('Ready.'); defaultReplies(); }
    } catch { await show('Ready.'); defaultReplies(); }
  } else {
    await show('New conversation.');
    defaultReplies();
  }
  renderChat();
}

function defaultReplies() {
  replies = [
    { text: 'Speak', action: 'speak' },
    { text: 'What can you do?', action: 'text', value: 'What can you do?' },
    { text: 'What time is it?', action: 'text', value: 'What time is it?' },
    { text: 'Calendar', action: 'text', value: "What's on my calendar?" },
    { text: 'Help', action: 'text', value: 'Help me' },
  ];
}

function makeReplies(data) {
  if (data?.length) {
    replies = [{ text: 'Speak', action: 'speak' }, ...data.map(r => ({ text: r, action: 'text', value: r }))];
  } else defaultReplies();
  selIdx = 0;
}

function renderChat() {
  // Show last response + replies list
  // Need to get the current body text
  // For now, just show replies
  const replyLines = replies.map((r, i) =>
    (i === selIdx ? '> ' : '  ') + r.text
  ).join('\n');
  // We need to preserve the response text... let's store it
  show(lastResponse + '\n---\n' + replyLines);
}

let lastResponse = 'Ready.';

// Override show to also track response
async function showResponse(text) {
  lastResponse = text;
  await show(text);
}

// ── Events ──────────────────────────────────────────────────
function onEvent(event) {
  // Capture ALL events for debugging
  const sysType = event.sysEvent?.eventType || '';
  const listIdx = event.listEvent?.currentSelectItemIndex;
  const listType = event.listEvent?.eventType || '';
  const textName = event.textEvent?.containerName || '';

  // Update debug display
  lastEvt = sysType || listType || textName || '?';

  // sysEvent handling
  if (event.sysEvent) {
    const et = event.sysEvent.eventType;

    if (et === 'swipe_up') {
      if (mode === 'start') { selIdx = Math.max(0, selIdx - 1); renderStart(); }
      else if (mode === 'chat') { selIdx = Math.max(0, selIdx - 1); renderChat(); }
      return;
    }
    if (et === 'swipe_down') {
      if (mode === 'start') { selIdx = Math.min(1, selIdx + 1); renderStart(); }
      else if (mode === 'chat') { selIdx = Math.min(replies.length - 1, selIdx + 1); renderChat(); }
      return;
    }
    if (et === 'tap' || et === 'press' || et === 'click') {
      if (mode === 'start') startChat(selIdx === 0);
      else if (mode === 'chat') doSelect();
      return;
    }
  }

  // listEvent handling
  if (event.listEvent) {
    if (typeof listIdx === 'number' && listIdx >= 0) {
      if (mode === 'start') { selIdx = listIdx; renderStart(); }
      else if (mode === 'chat') { selIdx = listIdx; renderChat(); }
    }
    return;
  }

  // textEvent handling — treat as tap
  if (event.textEvent) {
    if (mode === 'start') startChat(selIdx === 0);
    else if (mode === 'chat') doSelect();
  }
}

function doSelect() {
  if (processing) return;
  const r = replies[selIdx];
  if (!r) return;
  if (r.action === 'speak') listen();
  else if (r.action === 'text') sendMsg(r.value || r.text);
}

// ── Voice ──────────────────────────────────────────────────
async function listen() {
  if (!bridge) return;
  await show('[ Listening... ]');
  try {
    await bridge.audioControl(true, AudioInputSource.Glasses);
    const chunks = [];
    const unsub = bridge.onEvenHubEvent(e => { if (e.audioEvent?.audioPcm) chunks.push(e.audioEvent.audioPcm); });
    setTimeout(async () => {
      unsub(); await bridge.audioControl(false);
      if (chunks.length) {
        const len = chunks.reduce((s, c) => s + c.length, 0);
        const buf = new Uint8Array(len); let o = 0;
        for (const c of chunks) { buf.set(c, o); o += c.length; }
        sendAudio(buf);
      } else await show('No audio.');
    }, 10000);
  } catch { await show('MIC error.'); }
}

// ── API ──────────────────────────────────────────────────
async function sendMsg(text) {
  if (processing) return;
  processing = true;
  await show('Thinking...');
  history.push({ role: 'user', content: text });
  try {
    const r = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(-10) }),
    });
    if (!r.ok) throw new Error('API ' + r.status);
    const d = await r.json();
    history.push({ role: 'assistant', content: d.response });
    lastResponse = trunc(d.response);
    makeReplies(d.replies);
    renderChat();
  } catch (e) { await show('Error: ' + e.message); }
  finally { processing = false; }
}

async function sendAudio(data) {
  if (processing) return;
  processing = true;
  try {
    const r = await fetch(API_BASE + '/transcribe', {
      method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: data,
    });
    if (!r.ok) throw new Error('Transcribe ' + r.status);
    const d = await r.json();
    if (d.text) sendMsg(d.text);
    else { await show('No speech.'); processing = false; }
  } catch { await show('Error.'); processing = false; }
}

init();
</script>
</body>
</html>
