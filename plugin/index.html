<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="24x24" href="icon.png">
<title>Alita</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #111;
    color: #33ff33;
    width: 576px;
    height: 288px;
    overflow: hidden;
    font-size: 20px;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 12px 16px;
  }
  #status {
    position: absolute;
    top: 4px;
    right: 12px;
    font-size: 12px;
    color: #33ff3366;
  }
  #debug {
    position: absolute;
    bottom: 4px;
    left: 12px;
    font-size: 11px;
    color: #33ff3344;
    max-width: 90%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<div id="app">
  <div id="status">●</div>
  <div id="debug">Initializing...</div>
</div>

<script type="module">
import {
  waitForEvenAppBridge,
  AudioInputSource,
  StartUpPageCreateResult,
} from './node_modules/@evenrealities/even_hub_sdk/dist/index.js';

// ── Config ──────────────────────────────────────────────────
const API_BASE = 'http://192.168.0.203:9191';
const DISPLAY_MAX_CHARS = 300;

// Glasses canvas: 576 x 288
// Layout: header (40px) + response (180px) + divider (8px) + replies (60px)
const LAYOUT = {
  header:   { x: 16, y: 8,   w: 544, h: 32 },
  response: { x: 16, y: 48,  w: 544, h: 170 },
  replies:  { x: 16, y: 226, w: 544, h: 54 },
};

// ── State ──────────────────────────────────────────────────
let bridge = null;
let selectedIndex = 0;
let replies = [];
let isListening = false;
let isProcessing = false;
let conversationHistory = [];
let mode = 'boot'; // 'boot' | 'start' | 'chat'
let startSelectedIndex = 0;
let sessionInfo = null;
let glassesReady = false;

const debugEl = document.getElementById('debug');

function log(msg) {
  console.log('[Alita]', msg);
  debugEl.textContent = msg;
}

// ── Glasses Display ──────────────────────────────────────────────

async function initGlassesDisplay() {
  if (!bridge) return false;
  try {
    const result = await bridge.createStartUpPageContainer({
      containerTotalNum: 3,
      textObject: [
        {
          xPosition: LAYOUT.header.x,
          yPosition: LAYOUT.header.y,
          width: LAYOUT.header.w,
          height: LAYOUT.header.h,
          containerID: 1,
          containerName: 'header',
          content: '',
          isEventCapture: 0,
        },
        {
          xPosition: LAYOUT.response.x,
          yPosition: LAYOUT.response.y,
          width: LAYOUT.response.w,
          height: LAYOUT.response.h,
          containerID: 2,
          containerName: 'response',
          content: '',
          isEventCapture: 0,
        },
        {
          xPosition: LAYOUT.replies.x,
          yPosition: LAYOUT.replies.y,
          width: LAYOUT.replies.w,
          height: LAYOUT.replies.h,
          containerID: 3,
          containerName: 'replies',
          content: '',
          isEventCapture: 1,
        },
      ],
    });
    glassesReady = result === StartUpPageCreateResult.success;
    log('Glasses display: ' + (glassesReady ? 'OK' : 'FAIL'));
    return glassesReady;
  } catch (err) {
    log('Glasses init error: ' + err.message);
    return false;
  }
}

async function updateGlasses(containerID, containerName, content) {
  if (!bridge || !glassesReady) return;
  try {
    await bridge.textContainerUpgrade({
      containerID,
      containerName,
      content,
    });
  } catch (err) {
    log('Update error: ' + containerName + ': ' + err.message);
  }
}

async function updateHeader(text) {
  await updateGlasses(1, 'header', text);
}

async function updateResponse(text) {
  await updateGlasses(2, 'response', text);
}

async function updateReplies() {
  const lines = replies.map((r, i) =>
    (i === selectedIndex ? '> ' : '  ') + r.text
  ).join('\n');
  await updateGlasses(3, 'replies', lines);
}

// ── Init ──────────────────────────────────────────────────
async function init() {
  try {
    bridge = await waitForEvenAppBridge();
    log('Bridge connected');
    bridge.onEvenHubEvent(handleEvent);

    // Initialize glasses display
    await initGlassesDisplay();

    // Boot sequence on glasses
    await runBootSequence();
  } catch (err) {
    log('Init error: ' + err.message);
    // Still try boot sequence without bridge
    await runBootSequence();
  }
}

// ── Boot Sequence ──────────────────────────────────────────────
async function runBootSequence() {
  mode = 'boot';

  // Boot animation on glasses
  if (glassesReady) {
    await updateHeader('Alita');
    await updateResponse('A');
    await new Promise(r => setTimeout(r, 600));
    await updateResponse('A.');
    await new Promise(r => setTimeout(r, 500));
    await updateResponse('A..');
    await new Promise(r => setTimeout(r, 500));
    await updateResponse('A...');
    await new Promise(r => setTimeout(r, 800));
  }

  // Fetch session info
  await fetchSessionInfo();

  // Show start screen
  showStartScreen();
}

// ── Session Info ──────────────────────────────────────────────
async function fetchSessionInfo() {
  try {
    const res = await fetch(API_BASE + '/session-info');
    if (res.ok) {
      sessionInfo = await res.json();
    }
  } catch {
    // Silent fail
  }
}

// ── Start Screen ──────────────────────────────────────────────
function showStartScreen() {
  mode = 'start';
  startSelectedIndex = 0;

  const hint = sessionInfo?.lastTopic || '';
  const lines = [
    "Hi, I'm Alita",
    '',
    '> Continue',
    hint ? '  ' + hint : '',
    '',
    '  New conversation',
  ].filter((_, i) => i < 6).join('\n');

  if (glassesReady) {
    updateHeader('Alita');
    updateResponse(lines);
    updateReplies(); // clear replies area
  }
}

function updateStartSelection() {
  const hint = sessionInfo?.lastTopic || '';
  const lines = [
    "Hi, I'm Alita",
    '',
    startSelectedIndex === 0 ? '> Continue' : '  Continue',
    hint ? '  ' + hint : '',
    '',
    startSelectedIndex === 1 ? '> New conversation' : '  New conversation',
  ].join('\n');

  if (glassesReady) {
    updateResponse(lines);
  }
}

function selectStartOption() {
  if (startSelectedIndex === 0) {
    startChat(true);
  } else {
    startChat(false);
  }
}

// ── Chat ──────────────────────────────────────────────────────
async function startChat(continueSession) {
  mode = 'chat';

  if (glassesReady) {
    await updateHeader('Alita');
    await updateResponse('Loading...');
    await updateReplies();
  }

  if (continueSession) {
    try {
      const res = await fetch(API_BASE + '/continue');
      if (res.ok) {
        const data = await res.json();
        conversationHistory = data.history || [];
        const summary = data.summary || 'Ready.';
        await showResponse(summary);
        if (data.replies) {
          setReplies([
            { text: 'Speak', action: 'speak' },
            ...data.replies.map(r => ({ text: r, action: 'text', value: r })),
          ]);
        } else {
          setDefaultReplies();
        }
      } else {
        await showResponse('Ready.');
        setDefaultReplies();
      }
    } catch {
      await showResponse('Ready.');
      setDefaultReplies();
    }
  } else {
    await showResponse('New conversation.');
    setDefaultReplies();
  }

  await updateReplies();
}

function setDefaultReplies() {
  setReplies([
    { text: 'Speak', action: 'speak' },
    { text: 'What can you do?', action: 'text', value: 'What can you do?' },
    { text: 'What time is it?', action: 'text', value: 'What time is it?' },
    { text: 'Calendar', action: 'text', value: "What's on my calendar today?" },
    { text: 'Help', action: 'text', value: 'Help me with something' },
  ]);
}

async function showResponse(text) {
  let display = text;
  if (display.length > DISPLAY_MAX_CHARS) {
    display = display.slice(0, DISPLAY_MAX_CHARS) + '...';
  }
  if (glassesReady) {
    // Split into pages if needed (glasses show ~8 lines of ~45 chars each)
    await updateResponse(display);
  }
}

// ── Event Handler ──────────────────────────────────────────────
function handleEvent(event) {
  if (mode === 'start') {
    handleStartEvent(event);
    return;
  }

  if (event.sysEvent) {
    const { eventType } = event.sysEvent;
    if (eventType === 'swipe_up') {
      moveSelection(-1);
      return;
    }
    if (eventType === 'swipe_down') {
      moveSelection(1);
      return;
    }
    if (eventType === 'tap') {
      selectReply();
      return;
    }
  }

  if (event.listEvent) {
    const { currentSelectItemIndex, eventType } = event.listEvent;
    selectedIndex = currentSelectItemIndex;
    updateReplies();
    if (eventType === 'click' || eventType === 'tap') {
      selectReply();
    }
  }
}

function handleStartEvent(event) {
  if (event.sysEvent) {
    const { eventType } = event.sysEvent;
    if (eventType === 'swipe_up') {
      startSelectedIndex = Math.max(0, startSelectedIndex - 1);
      updateStartSelection();
    } else if (eventType === 'swipe_down') {
      startSelectedIndex = Math.min(1, startSelectedIndex + 1);
      updateStartSelection();
    } else if (eventType === 'tap') {
      selectStartOption();
    }
  }
  if (event.listEvent) {
    const { eventType } = event.listEvent;
    if (eventType === 'click' || eventType === 'tap') selectStartOption();
  }
}

// ── Navigation ──────────────────────────────────────────────
function moveSelection(dir) {
  if (isProcessing) return;
  selectedIndex = Math.max(0, Math.min(replies.length - 1, selectedIndex + dir));
  updateReplies();
}

function selectReply() {
  if (isProcessing) return;
  const reply = replies[selectedIndex];
  if (!reply) return;

  if (reply.action === 'speak') {
    startListening();
  } else if (reply.action === 'text') {
    sendMessage(reply.value || reply.text);
  }
}

// ── Voice Input ──────────────────────────────────────────────
async function startListening() {
  if (isListening || !bridge) return;
  isListening = true;

  if (glassesReady) {
    await updateResponse('[ Listening... ]');
  }

  try {
    await bridge.audioControl(true, AudioInputSource.Glasses);

    const audioChunks = [];
    const unsubscribe = bridge.onEvenHubEvent((event) => {
      if (event.audioEvent && event.audioEvent.audioPcm) {
        audioChunks.push(event.audioEvent.audioPcm);
      }
    });

    setTimeout(async () => {
      unsubscribe();
      await bridge.audioControl(false);
      isListening = false;

      if (audioChunks.length > 0) {
        const totalLength = audioChunks.reduce((sum, c) => sum + c.length, 0);
        const audioData = new Uint8Array(totalLength);
        let offset = 0;
        for (const chunk of audioChunks) {
          audioData.set(chunk, offset);
          offset += chunk.length;
        }
        sendAudio(audioData);
      } else {
        if (glassesReady) await updateResponse('No audio captured.');
      }
    }, 10000);
  } catch (err) {
    log('Audio error: ' + err.message);
    isListening = false;
    if (glassesReady) await updateResponse('MIC error.');
  }
}

// ── API Calls ──────────────────────────────────────────────
async function sendMessage(text) {
  if (isProcessing) return;
  isProcessing = true;

  if (glassesReady) {
    await updateResponse('Thinking...');
    await updateReplies();
  }

  conversationHistory.push({ role: 'user', content: text });

  try {
    const res = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        history: conversationHistory.slice(-10),
      }),
    });

    if (!res.ok) throw new Error('API ' + res.status);
    const data = await res.json();

    conversationHistory.push({ role: 'assistant', content: data.response });

    await showResponse(data.response);

    if (data.replies && data.replies.length > 0) {
      setReplies([
        { text: 'Speak', action: 'speak' },
        ...data.replies.map(r => ({ text: r, action: 'text', value: r })),
      ]);
    } else {
      setDefaultReplies();
    }
    await updateReplies();
  } catch (err) {
    await showResponse('Error: ' + err.message);
  } finally {
    isProcessing = false;
  }
}

async function sendAudio(audioData) {
  if (isProcessing) return;
  isProcessing = true;

  try {
    const res = await fetch(API_BASE + '/transcribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: audioData,
    });
    if (!res.ok) throw new Error('Transcribe ' + res.status);
    const data = await res.json();
    if (data.text) {
      sendMessage(data.text);
    } else {
      if (glassesReady) await updateResponse('No speech detected.');
      isProcessing = false;
    }
  } catch (err) {
    if (glassesReady) await updateResponse('Transcription error.');
    isProcessing = false;
  }
}

// ── Rendering ──────────────────────────────────────────────
function setReplies(newReplies) {
  replies = newReplies.slice(0, 5);
  selectedIndex = 0;
}

// ── Bootstrap ──────────────────────────────────────────────
init();
</script>
</body>
</html>
