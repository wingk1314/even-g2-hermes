<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="24x24" href="icon.png">
<title>Alita</title>
</head>
<body>
<script type="module">
import {
  waitForEvenAppBridge,
  AudioInputSource,
  StartUpPageCreateResult,
} from './node_modules/@evenrealities/even_hub_sdk/dist/index.js';

const API_BASE = 'http://192.168.0.203:9191';
const MAX_CHARS = 280;

// Glasses: 576 x 288
// Layout: header + body (list or text) + bottom list
const L = {
  header: { x: 16, y: 8,   w: 544, h: 32 },
  body:   { x: 16, y: 48,  w: 544, h: 168 },
  bottom: { x: 16, y: 220, w: 544, h: 60 },
};

let bridge = null, glassesReady = false;
let mode = 'boot', selectedIndex = 0, startSelectedIndex = 0;
let replies = [], isProcessing = false, conversationHistory = [], sessionInfo = null;

function log(m) { console.log('[Alita]', m); }

// ── Glasses Containers ──────────────────────────────────────────

// Start screen: greeting in header, Continue/New as list in body
function startContainers() {
  const hint = sessionInfo?.lastTopic || '';
  return {
    containerTotalNum: 3,
    textObject: [
      { xPosition: L.header.x, yPosition: L.header.y, width: L.header.w, height: L.header.h,
        containerID: 1, containerName: 'header', content: "Hi, I'm Alita", isEventCapture: 0 },
      { xPosition: L.bottom.x, yPosition: L.bottom.y, width: L.bottom.w, height: L.bottom.h,
        containerID: 3, containerName: 'bottom', content: '', isEventCapture: 0 },
    ],
    listObject: [
      { xPosition: L.body.x, yPosition: L.body.y, width: L.body.w, height: L.body.h,
        containerID: 2, containerName: 'body',
        itemContainer: {
          itemCount: 2,
          itemName: [
            'Continue' + (hint ? '  (' + hint.slice(0, 35) + ')' : ''),
            'New conversation',
          ],
        },
        isEventCapture: 1 },
    ],
  };
}

// Chat screen: response as text, replies as list
function chatContainers() {
  return {
    containerTotalNum: 3,
    textObject: [
      { xPosition: L.header.x, yPosition: L.header.y, width: L.header.w, height: L.header.h,
        containerID: 1, containerName: 'header', content: 'Alita', isEventCapture: 0 },
      { xPosition: L.body.x, yPosition: L.body.y, width: L.body.w, height: L.body.h,
        containerID: 2, containerName: 'body', content: '', isEventCapture: 0 },
    ],
    listObject: [
      { xPosition: L.bottom.x, yPosition: L.bottom.y, width: L.bottom.w, height: L.bottom.h,
        containerID: 3, containerName: 'bottom',
        itemContainer: {
          itemCount: Math.max(1, replies.length),
          itemName: replies.map(r => r.text),
        },
        isEventCapture: 1 },
    ],
  };
}

// Thinking/loading state: all text, no list events
function thinkingContainers() {
  return {
    containerTotalNum: 3,
    textObject: [
      { xPosition: L.header.x, yPosition: L.header.y, width: L.header.w, height: L.header.h,
        containerID: 1, containerName: 'header', content: 'Alita', isEventCapture: 0 },
      { xPosition: L.body.x, yPosition: L.body.y, width: L.body.w, height: L.body.h,
        containerID: 2, containerName: 'body', content: '', isEventCapture: 0 },
      { xPosition: L.bottom.x, yPosition: L.bottom.y, width: L.bottom.w, height: L.bottom.h,
        containerID: 3, containerName: 'bottom', content: '', isEventCapture: 0 },
    ],
  };
}

async function rebuild(layout) {
  if (!bridge) return;
  try {
    await bridge.rebuildPageContainer(layout);
    glassesReady = true;
  } catch (e) { log('rebuild: ' + e.message); }
}

async function initGlasses() {
  if (!bridge) return;
  try {
    const r = await bridge.createStartUpPageContainer(startContainers());
    glassesReady = r === StartUpPageCreateResult.success;
    log('Glasses: ' + (glassesReady ? 'OK' : 'FAIL'));
  } catch (e) { log('init: ' + e.message); }
}

async function pushText(id, name, content) {
  if (!bridge || !glassesReady) return;
  try { await bridge.textContainerUpgrade({ containerID: id, containerName: name, content }); }
  catch {}
}

// ── Init ──────────────────────────────────────────────────
async function init() {
  try {
    bridge = await waitForEvenAppBridge();
    log('Bridge OK');
    bridge.onEvenHubEvent(handleEvent);
    await initGlasses();
    await boot();
  } catch (e) { log('Bridge fail: ' + e.message); }
}

// ── Boot ──────────────────────────────────────────────────
async function boot() {
  mode = 'boot';
  if (glassesReady) {
    await pushText(1, 'header', 'Alita');
    await pushText(2, 'body', 'Starting.');
    await new Promise(r => setTimeout(r, 800));
    await pushText(2, 'body', 'Starting..');
    await new Promise(r => setTimeout(r, 800));
    await pushText(2, 'body', 'Starting...');
    await new Promise(r => setTimeout(r, 600));
  }
  await fetchSessionInfo();
  showStartScreen();
}

async function fetchSessionInfo() {
  try {
    const res = await fetch(API_BASE + '/session-info');
    if (res.ok) sessionInfo = await res.json();
  } catch {}
}

// ── Start Screen ──────────────────────────────────────────────
async function showStartScreen() {
  mode = 'start';
  startSelectedIndex = 0;
  // List container handles selection natively
  await rebuild(startContainers());
}

// ── Chat ──────────────────────────────────────────────────
async function startChat(continueSession) {
  mode = 'chat';

  // Show loading state (no list, just text)
  await rebuild(thinkingContainers());
  await pushText(2, 'body', 'Loading...');

  if (continueSession) {
    try {
      const res = await fetch(API_BASE + '/continue');
      if (res.ok) {
        const d = await res.json();
        conversationHistory = d.history || [];
        await pushText(2, 'body', trunc(d.summary || 'Ready.'));
        loadReplies(d.replies);
      } else {
        await pushText(2, 'body', 'Ready.');
        defaultReplies();
      }
    } catch {
      await pushText(2, 'body', 'Ready.');
      defaultReplies();
    }
  } else {
    await pushText(2, 'body', 'New conversation.');
    defaultReplies();
  }

  // Now rebuild with reply list
  await rebuild(chatContainers());
}

function defaultReplies() {
  replies = [
    { text: 'Speak', action: 'speak' },
    { text: 'What can you do?', action: 'text', value: 'What can you do?' },
    { text: 'What time is it?', action: 'text', value: 'What time is it?' },
    { text: 'Calendar', action: 'text', value: "What's on my calendar?" },
    { text: 'Help', action: 'text', value: 'Help me' },
  ];
  selectedIndex = 0;
}

function loadReplies(data) {
  if (data?.length > 0) {
    replies = [
      { text: 'Speak', action: 'speak' },
      ...data.map(r => ({ text: r, action: 'text', value: r })),
    ];
  } else { defaultReplies(); }
  selectedIndex = 0;
}

function trunc(t) {
  let s = t || '';
  return s.length > MAX_CHARS ? s.slice(0, MAX_CHARS) + '...' : s;
}

// ── Events ──────────────────────────────────────────────────
function handleEvent(event) {
  // List events (selection in list containers)
  if (event.listEvent) {
    const { currentSelectItemIndex, eventType } = event.listEvent;
    selectedIndex = currentSelectItemIndex;

    if (mode === 'start') {
      startSelectedIndex = currentSelectItemIndex;
      if (eventType === 'click' || eventType === 'tap') doStartSelect();
      return;
    }

    if (mode === 'chat') {
      selectedIndex = currentSelectItemIndex;
      if (eventType === 'click' || eventType === 'tap') doReplySelect();
      return;
    }
  }

  // System events (backup — list containers handle most input)
  if (event.sysEvent) {
    const et = event.sysEvent.eventType;

    if (mode === 'start') {
      if (et === 'tap' || et === 'press' || et === 'click') doStartSelect();
      return;
    }

    if (mode === 'chat') {
      if (et === 'tap' || et === 'press' || et === 'click') doReplySelect();
      return;
    }
  }
}

function doStartSelect() {
  startChat(startSelectedIndex === 0);
}

function doReplySelect() {
  if (isProcessing) return;
  const r = replies[selectedIndex];
  if (!r) return;
  if (r.action === 'speak') startListening();
  else if (r.action === 'text') sendMessage(r.value || r.text);
}

// ── Voice ──────────────────────────────────────────────────
async function startListening() {
  if (!bridge) return;
  await rebuild(thinkingContainers());
  await pushText(2, 'body', '[ Listening... ]');
  try {
    await bridge.audioControl(true, AudioInputSource.Glasses);
    const chunks = [];
    const unsub = bridge.onEvenHubEvent(e => {
      if (e.audioEvent?.audioPcm) chunks.push(e.audioEvent.audioPcm);
    });
    setTimeout(async () => {
      unsub();
      await bridge.audioControl(false);
      if (chunks.length > 0) {
        const len = chunks.reduce((s, c) => s + c.length, 0);
        const buf = new Uint8Array(len);
        let off = 0;
        for (const c of chunks) { buf.set(c, off); off += c.length; }
        sendAudio(buf);
      } else {
        await pushText(2, 'body', 'No audio.');
      }
    }, 10000);
  } catch (e) {
    await pushText(2, 'body', 'MIC error.');
  }
}

// ── API ──────────────────────────────────────────────────
async function sendMessage(text) {
  if (isProcessing) return;
  isProcessing = true;

  // Show thinking (no list events during processing)
  await rebuild(thinkingContainers());
  await pushText(2, 'body', 'Thinking...');

  conversationHistory.push({ role: 'user', content: text });

  try {
    const res = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: conversationHistory.slice(-10) }),
    });
    if (!res.ok) throw new Error('API ' + res.status);
    const data = await res.json();
    conversationHistory.push({ role: 'assistant', content: data.response });

    await pushText(2, 'body', trunc(data.response));
    loadReplies(data.replies);
    await rebuild(chatContainers());
  } catch (e) {
    await pushText(2, 'body', 'Error: ' + e.message);
  } finally {
    isProcessing = false;
  }
}

async function sendAudio(audioData) {
  if (isProcessing) return;
  isProcessing = true;
  try {
    const res = await fetch(API_BASE + '/transcribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: audioData,
    });
    if (!res.ok) throw new Error('Transcribe ' + res.status);
    const data = await res.json();
    if (data.text) sendMessage(data.text);
    else { await pushText(2, 'body', 'No speech.'); isProcessing = false; }
  } catch {
    await pushText(2, 'body', 'Transcribe error.');
    isProcessing = false;
  }
}

init();
</script>
</body>
</html>
