<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="24x24" href="icon.png">
<title>Alita</title>
</head>
<body>
<script type="module">
import {
  waitForEvenAppBridge,
  AudioInputSource,
  StartUpPageCreateResult,
} from './node_modules/@evenrealities/even_hub_sdk/dist/index.js';

const API_BASE = 'http://192.168.0.203:9191';
const MAX = 280;

let bridge = null, ready = false, mode = 'boot';
let replies = [], selIdx = 0, processing = false;
let history = [], sessionInfo = null;

function log(m) { console.log('[Alita]', m); }
function trunc(s) { return (s || '').length > MAX ? s.slice(0, MAX) + '...' : s || ''; }

// ── Glasses: Create initial layout ──────────────────────────────
// 3 text containers: header, body, footer
// Start with no event capture — we'll rebuild per screen
async function createDisplay() {
  if (!bridge) return;
  try {
    const r = await bridge.createStartUpPageContainer({
      containerTotalNum: 3,
      textObject: [
        { xPosition: 16, yPosition: 8, width: 544, height: 32,
          containerID: 1, containerName: 'hdr', content: '', isEventCapture: 0 },
        { xPosition: 16, yPosition: 48, width: 544, height: 168,
          containerID: 2, containerName: 'body', content: '', isEventCapture: 0 },
        { xPosition: 16, yPosition: 224, width: 544, height: 56,
          containerID: 3, containerName: 'ftr', content: '', isEventCapture: 1 },
      ],
    });
    ready = r === StartUpPageCreateResult.success;
    log('Display: ' + (ready ? 'OK' : 'FAIL'));
  } catch (e) { log('Display err: ' + e.message); }
}

// Update text in a container
async function set(id, name, text) {
  if (!bridge || !ready) return;
  try { await bridge.textContainerUpgrade({ containerID: id, containerName: name, content: text }); }
  catch {}
}

// Rebuild page — only call on major screen transitions
async function rebuild(layout) {
  if (!bridge) return;
  try { await bridge.rebuildPageContainer(layout); ready = true; }
  catch (e) { log('rebuild err: ' + e.message); }
}

// ── Screen layouts ──────────────────────────────────────────────

// Start screen: list for Continue/New in body, events on body
function layoutStart() {
  return {
    containerTotalNum: 3,
    textObject: [
      { xPosition: 16, yPosition: 8, width: 544, height: 32,
        containerID: 1, containerName: 'hdr', content: "Hi, I'm Alita", isEventCapture: 0 },
      { xPosition: 16, yPosition: 224, width: 544, height: 56,
        containerID: 3, containerName: 'ftr', content: '', isEventCapture: 0 },
    ],
    listObject: [
      { xPosition: 16, yPosition: 48, width: 544, height: 168,
        containerID: 2, containerName: 'body',
        itemContainer: { itemCount: 2, itemName: ['Continue', 'New conversation'] },
        isEventCapture: 1 },
    ],
  };
}

// Chat screen: text body + list footer, events on footer
function layoutChat() {
  const names = replies.length > 0 ? replies.map(r => r.text) : [''];
  return {
    containerTotalNum: 3,
    textObject: [
      { xPosition: 16, yPosition: 8, width: 544, height: 32,
        containerID: 1, containerName: 'hdr', content: 'Alita', isEventCapture: 0 },
      { xPosition: 16, yPosition: 48, width: 544, height: 168,
        containerID: 2, containerName: 'body', content: '', isEventCapture: 0 },
    ],
    listObject: [
      { xPosition: 16, yPosition: 224, width: 544, height: 56,
        containerID: 3, containerName: 'ftr',
        itemContainer: { itemCount: Math.max(1, names.length), itemName: names },
        isEventCapture: 1 },
    ],
  };
}

// ── Init ──────────────────────────────────────────────────
async function init() {
  try {
    bridge = await waitForEvenAppBridge();
    log('Bridge OK');
    bridge.onEvenHubEvent(onEvent);
    await createDisplay();
    await boot();
  } catch (e) { log('Init err: ' + e.message); }
}

// ── Boot sequence ──────────────────────────────────────────────
async function boot() {
  mode = 'boot';
  if (ready) {
    await set(1, 'hdr', 'Alita');
    await set(2, 'body', 'Starting.');
    await sleep(700);
    await set(2, 'body', 'Starting..');
    await sleep(700);
    await set(2, 'body', 'Starting...');
    await sleep(500);
  }
  // Fetch session info
  try { const r = await fetch(API_BASE + '/session-info'); if (r.ok) sessionInfo = await r.json(); } catch {}
  showStart();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Start screen ──────────────────────────────────────────────
async function showStart() {
  mode = 'start';
  await rebuild(layoutStart());
}

// ── Chat ──────────────────────────────────────────────────
async function startChat(continued) {
  mode = 'chat';

  // First rebuild to chat layout (clears list events during load)
  replies = [{ text: '...', action: 'wait' }];
  await rebuild(layoutChat());
  await set(2, 'body', 'Loading...');

  if (continued) {
    try {
      const r = await fetch(API_BASE + '/continue');
      if (r.ok) {
        const d = await r.json();
        history = d.history || [];
        await set(2, 'body', trunc(d.summary || 'Ready.'));
        makeReplies(d.replies);
      } else {
        await set(2, 'body', 'Ready.');
        defaultReplies();
      }
    } catch { await set(2, 'body', 'Ready.'); defaultReplies(); }
  } else {
    await set(2, 'body', 'New conversation.');
    defaultReplies();
  }

  selIdx = 0;
  await rebuild(layoutChat());
}

function defaultReplies() {
  replies = [
    { text: 'Speak', action: 'speak' },
    { text: 'What can you do?', action: 'text', value: 'What can you do?' },
    { text: 'Time', action: 'text', value: 'What time is it?' },
    { text: 'Calendar', action: 'text', value: "What's on my calendar?" },
    { text: 'Help', action: 'text', value: 'Help me' },
  ];
}

function makeReplies(data) {
  if (data?.length) {
    replies = [{ text: 'Speak', action: 'speak' }, ...data.map(r => ({ text: r, action: 'text', value: r }))];
  } else defaultReplies();
  selIdx = 0;
}

// ── Events ──────────────────────────────────────────────────
function onEvent(event) {
  log('evt: ' + JSON.stringify({
    sys: event.sysEvent?.eventType,
    list: event.listEvent?.eventType,
    idx: event.listEvent?.currentSelectItemIndex,
  }));

  // List selection events
  if (event.listEvent) {
    const idx = event.listEvent.currentSelectItemIndex;
    const type = event.listEvent.eventType;

    if (mode === 'start') {
      // idx 0 = Continue, idx 1 = New
      if (type === 'click' || type === 'tap') {
        startChat(idx === 0);
      }
      return;
    }

    if (mode === 'chat') {
      selIdx = idx;
      if (type === 'click' || type === 'tap') {
        doSelect();
      }
      return;
    }
  }

  // System events (tap/press as backup)
  if (event.sysEvent) {
    const et = event.sysEvent.eventType;
    if (et === 'tap' || et === 'press' || et === 'click') {
      if (mode === 'start') startChat(0 === 0); // default Continue
      else if (mode === 'chat') doSelect();
    }
  }
}

function doSelect() {
  if (processing) return;
  const r = replies[selIdx];
  if (!r) return;
  if (r.action === 'speak') listen();
  else if (r.action === 'text') sendMsg(r.value || r.text);
}

// ── Voice ──────────────────────────────────────────────────
async function listen() {
  if (!bridge) return;
  await set(2, 'body', '[ Listening... ]');
  try {
    await bridge.audioControl(true, AudioInputSource.Glasses);
    const chunks = [];
    const unsub = bridge.onEvenHubEvent(e => { if (e.audioEvent?.audioPcm) chunks.push(e.audioEvent.audioPcm); });
    setTimeout(async () => {
      unsub(); await bridge.audioControl(false);
      if (chunks.length) {
        const len = chunks.reduce((s, c) => s + c.length, 0);
        const buf = new Uint8Array(len); let o = 0;
        for (const c of chunks) { buf.set(c, o); o += c.length; }
        sendAudio(buf);
      } else await set(2, 'body', 'No audio.');
    }, 10000);
  } catch { await set(2, 'body', 'MIC error.'); }
}

// ── API ──────────────────────────────────────────────────
async function sendMsg(text) {
  if (processing) return;
  processing = true;
  await set(2, 'body', 'Thinking...');
  history.push({ role: 'user', content: text });

  try {
    const r = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(-10) }),
    });
    if (!r.ok) throw new Error('API ' + r.status);
    const d = await r.json();
    history.push({ role: 'assistant', content: d.response });
    await set(2, 'body', trunc(d.response));
    makeReplies(d.replies);
    selIdx = 0;
    await rebuild(layoutChat());
  } catch (e) {
    await set(2, 'body', 'Error: ' + e.message);
  } finally { processing = false; }
}

async function sendAudio(data) {
  if (processing) return;
  processing = true;
  try {
    const r = await fetch(API_BASE + '/transcribe', {
      method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: data,
    });
    if (!r.ok) throw new Error('Transcribe ' + r.status);
    const d = await r.json();
    if (d.text) sendMsg(d.text);
    else { await set(2, 'body', 'No speech.'); processing = false; }
  } catch { await set(2, 'body', 'Error.'); processing = false; }
}

init();
</script>
</body>
</html>
