<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="24x24" href="icon.png">
<title>Alita</title>
</head>
<body>
<script type="module">
import {
  waitForEvenAppBridge,
  AudioInputSource,
  StartUpPageCreateResult,
} from './node_modules/@evenrealities/even_hub_sdk/dist/index.js';

const API_BASE = 'http://192.168.0.203:9191';
const MAX = 400;

let bridge = null, ready = false, mode = 'boot';
let selIdx = 0, replies = [], processing = false;
let history = [], sessionInfo = null;
let lastBody = 'Ready.';

function trunc(s) { return (s || '').length > MAX ? s.slice(0, MAX) + '...' : s || ''; }

// ── Debounce for tap vs swipe ──────────────────────────────
// Swipe fires rapid listEvents; tap fires a single one.
// Wait TAP_DELAY after last listEvent. If no more come, it's a tap.
let tapTimer = null;
const TAP_DELAY = 600; // ms — must be longer than gap between swipe events

function scheduleTap(action) {
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(action, TAP_DELAY);
}

function cancelTap() {
  if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
}

// ── Display ──────────────────────────────────────────────────

// Start screen: header text + list (Continue/New)
function startLayout() {
  return {
    containerTotalNum: 2,
    textObject: [{
      xPosition: 16, yPosition: 8, width: 544, height: 40,
      containerID: 1, containerName: 'hdr',
      content: "Hi, I'm Alita", isEventCapture: 0,
    }],
    listObject: [{
      xPosition: 16, yPosition: 56, width: 544, height: 224,
      containerID: 2, containerName: 'menu',
      itemContainer: { itemCount: 2, itemName: ['Continue', 'New conversation'] },
      isEventCapture: 1,
    }],
  };
}

// Chat screen: header + body text + reply list
function chatLayout(bodyText) {
  const names = replies.length ? replies.map(r => r.text) : [''];
  return {
    containerTotalNum: 3,
    textObject: [
      { xPosition: 16, yPosition: 8, width: 544, height: 32,
        containerID: 1, containerName: 'hdr', content: 'Alita', isEventCapture: 0 },
      { xPosition: 16, yPosition: 44, width: 544, height: 140,
        containerID: 2, containerName: 'body', content: bodyText || '', isEventCapture: 0 },
    ],
    listObject: [{
      xPosition: 16, yPosition: 188, width: 544, height: 92,
      containerID: 3, containerName: 'replies',
      itemContainer: { itemCount: Math.max(1, names.length), itemName: names },
      isEventCapture: 1,
    ],
  };
}

async function rebuild(layout) {
  if (!bridge) return;
  try { await bridge.rebuildPageContainer(layout); ready = true; } catch {}
}

async function setText(id, name, text) {
  if (!bridge || !ready) return;
  try { await bridge.textContainerUpgrade({ containerID: id, containerName: name, content: text }); } catch {}
}

// ── Init ──────────────────────────────────────────────────
async function init() {
  try {
    bridge = await waitForEvenAppBridge();
    bridge.onEvenHubEvent(onEvent);
    // Create initial display
    const r = await bridge.createStartUpPageContainer(startLayout());
    ready = r === StartUpPageCreateResult.success;
    await boot();
  } catch {}
}

// ── Boot ──────────────────────────────────────────────────
async function boot() {
  mode = 'boot';
  await setText(1, 'hdr', 'Alita');
  // Wait then show start
  await new Promise(r => setTimeout(r, 2000));
  try { const r = await fetch(API_BASE + '/session-info'); if (r.ok) sessionInfo = await r.json(); } catch {}
  showStart();
}

// ── Start Screen ──────────────────────────────────────────
async function showStart() {
  mode = 'start';
  // Rebuild to show start layout
  await rebuild(startLayout());
}

// ── Chat ──────────────────────────────────────────────────
async function startChat(continued) {
  mode = 'chat';
  selIdx = 0;

  // Build chat layout with loading message
  replies = [{ text: '...', action: 'wait' }];
  lastBody = 'Loading...';
  await rebuild(chatLayout(lastBody));

  if (continued) {
    try {
      const r = await fetch(API_BASE + '/continue');
      if (r.ok) {
        const d = await r.json();
        history = d.history || [];
        lastBody = trunc(d.summary || 'Ready.');
        makeReplies(d.replies);
      } else { lastBody = 'Ready.'; defaultReplies(); }
    } catch { lastBody = 'Ready.'; defaultReplies(); }
  } else {
    lastBody = 'New conversation.';
    defaultReplies();
  }

  // Rebuild with body + replies
  selIdx = 0;
  await rebuild(chatLayout(lastBody));
}

function defaultReplies() {
  replies = [
    { text: 'Speak', action: 'speak' },
    { text: 'What can you do?', action: 'text', value: 'What can you do?' },
    { text: 'What time is it?', action: 'text', value: 'What time is it?' },
    { text: 'Calendar', action: 'text', value: "What's on my calendar?" },
    { text: 'Help', action: 'text', value: 'Help me' },
  ];
}

function makeReplies(data) {
  if (data?.length) {
    replies = [{ text: 'Speak', action: 'speak' }, ...data.map(r => ({ text: r, action: 'text', value: r }))];
  } else defaultReplies();
  selIdx = 0;
}

// ── Events ──────────────────────────────────────────────────
function onEvent(event) {
  // List events: swipe navigation only, debounce for tap
  if (event.listEvent) {
    const idx = event.listEvent.currentSelectItemIndex;
    if (typeof idx === 'number' && idx >= 0) {
      selIdx = idx;
      // Debounce: if no more events in 500ms, treat as tap
      scheduleTap(() => {
        if (mode === 'start') startChat(selIdx === 0);
        else if (mode === 'chat') doSelect();
      });
    }
    return;
  }

  // sysEvent: tap/press fires immediately
  if (event.sysEvent) {
    cancelTap(); // cancel any pending debounce
    if (mode === 'start') startChat(selIdx === 0);
    else if (mode === 'chat') doSelect();
  }
}

function doSelect() {
  if (processing) return;
  const r = replies[selIdx];
  if (!r) return;
  if (r.action === 'speak') listen();
  else if (r.action === 'text') sendMsg(r.value || r.text);
}

// ── Voice ──────────────────────────────────────────────────
async function listen() {
  if (!bridge) return;
  await setText(2, 'body', '[ Listening... ]');
  try {
    await bridge.audioControl(true, AudioInputSource.Glasses);
    const chunks = [];
    const unsub = bridge.onEvenHubEvent(e => { if (e.audioEvent?.audioPcm) chunks.push(e.audioEvent.audioPcm); });
    setTimeout(async () => {
      unsub(); await bridge.audioControl(false);
      if (chunks.length) {
        const len = chunks.reduce((s, c) => s + c.length, 0);
        const buf = new Uint8Array(len); let o = 0;
        for (const c of chunks) { buf.set(c, o); o += c.length; }
        sendAudio(buf);
      } else await setText(2, 'body', 'No audio.');
    }, 10000);
  } catch { await setText(2, 'body', 'MIC error.'); }
}

// ── API ──────────────────────────────────────────────────
async function sendMsg(text) {
  if (processing) return;
  processing = true;
  lastBody = 'Thinking...';
  await rebuild(chatLayout(lastBody));
  history.push({ role: 'user', content: text });
  try {
    const r = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(-10) }),
    });
    if (!r.ok) throw new Error('API ' + r.status);
    const d = await r.json();
    history.push({ role: 'assistant', content: d.response });
    lastBody = trunc(d.response);
    makeReplies(d.replies);
    selIdx = 0;
    await rebuild(chatLayout(lastBody));
  } catch (e) { lastBody = 'Error: ' + e.message; await rebuild(chatLayout(lastBody)); }
  finally { processing = false; }
}

async function sendAudio(data) {
  if (processing) return;
  processing = true;
  try {
    const r = await fetch(API_BASE + '/transcribe', {
      method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: data,
    });
    if (!r.ok) throw new Error('Transcribe ' + r.status);
    const d = await r.json();
    if (d.text) sendMsg(d.text);
    else { await setText(2, 'body', 'No speech.'); processing = false; }
  } catch { await setText(2, 'body', 'Error.'); processing = false; }
}

init();
</script>
</body>
</html>
