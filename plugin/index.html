<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="24x24" href="icon.png">
<title>Alita</title>
<style>
  body { display: none; }
</style>
</head>
<body>
<script type="module">
import {
  waitForEvenAppBridge,
  AudioInputSource,
  StartUpPageCreateResult,
} from './node_modules/@evenrealities/even_hub_sdk/dist/index.js';

// ── Config ──────────────────────────────────────────────────
const API_BASE = 'http://192.168.0.203:9191';
const MAX_CHARS = 280;

// Glasses: 576 x 288
const LAYOUT = {
  header:   { x: 16, y: 8,   w: 544, h: 32 },
  response: { x: 16, y: 48,  w: 544, h: 168 },
  replies:  { x: 16, y: 220, w: 544, h: 60 },
};

// ── State ──────────────────────────────────────────────────
let bridge = null;
let glassesReady = false;
let mode = 'boot'; // boot | start | chat
let selectedIndex = 0;
let startSelectedIndex = 0;
let replies = []; // { text, action, value? }
let isProcessing = false;
let conversationHistory = [];
let sessionInfo = null;

function log(msg) { console.log('[Alita]', msg); }

// ── Glasses Display ──────────────────────────────────────────────

// Start screen: response captures events (for Continue/New selection)
function startScreenContainers() {
  return {
    containerTotalNum: 3,
    textObject: [
      {
        xPosition: LAYOUT.header.x, yPosition: LAYOUT.header.y,
        width: LAYOUT.header.w, height: LAYOUT.header.h,
        containerID: 1, containerName: 'header',
        content: '', isEventCapture: 0,
      },
      {
        xPosition: LAYOUT.response.x, yPosition: LAYOUT.response.y,
        width: LAYOUT.response.w, height: LAYOUT.response.h,
        containerID: 2, containerName: 'response',
        content: '', isEventCapture: 1, // captures swipe/tap for selection
      },
    ],
    listObject: [
      {
        xPosition: LAYOUT.replies.x, yPosition: LAYOUT.replies.y,
        width: LAYOUT.replies.w, height: LAYOUT.replies.h,
        containerID: 3, containerName: 'replies',
        itemContainer: { itemCount: 1, itemName: [''] },
        isEventCapture: 0,
      },
    ],
  };
}

// Chat screen: list container captures events (built-in selection)
function chatScreenContainers(numReplies) {
  return {
    containerTotalNum: 3,
    textObject: [
      {
        xPosition: LAYOUT.header.x, yPosition: LAYOUT.header.y,
        width: LAYOUT.header.w, height: LAYOUT.header.h,
        containerID: 1, containerName: 'header',
        content: '', isEventCapture: 0,
      },
      {
        xPosition: LAYOUT.response.x, yPosition: LAYOUT.response.y,
        width: LAYOUT.response.w, height: LAYOUT.response.h,
        containerID: 2, containerName: 'response',
        content: '', isEventCapture: 0,
      },
    ],
    listObject: [
      {
        xPosition: LAYOUT.replies.x, yPosition: LAYOUT.replies.y,
        width: LAYOUT.replies.w, height: LAYOUT.replies.h,
        containerID: 3, containerName: 'replies',
        itemContainer: {
          itemCount: Math.max(1, numReplies),
          itemName: replies.map(r => r.text) || [''],
        },
        isEventCapture: 1, // list handles swipe navigation natively
      },
    ],
  };
}

async function rebuildForStart() {
  if (!bridge) return;
  try {
    await bridge.rebuildPageContainer(startScreenContainers());
    glassesReady = true;
  } catch (e) { log('rebuild start: ' + e.message); }
}

async function rebuildForChat() {
  if (!bridge) return;
  try {
    await bridge.rebuildPageContainer(chatScreenContainers(replies.length));
    glassesReady = true;
  } catch (e) { log('rebuild chat: ' + e.message); }
}

async function initGlasses() {
  if (!bridge) return;
  try {
    const r = await bridge.createStartUpPageContainer(startScreenContainers());
    glassesReady = r === StartUpPageCreateResult.success;
    log('Glasses: ' + (glassesReady ? 'OK' : 'FAIL'));
  } catch (e) { log('init error: ' + e.message); }
}

async function push(id, name, content) {
  if (!bridge || !glassesReady) return;
  try { await bridge.textContainerUpgrade({ containerID: id, containerName: name, content }); }
  catch (e) { log('push: ' + name); }
}

async function pushHeader(t) { await push(1, 'header', t); }
async function pushResponse(t) { await push(2, 'response', t); }

async function pushReplyList() {
  if (!bridge || !glassesReady) return;
  try {
    await bridge.rebuildPageContainer(chatScreenContainers(replies.length));
  } catch (e) { log('rebuild replies: ' + e.message); }
}

// ── Init ──────────────────────────────────────────────────
async function init() {
  try {
    bridge = await waitForEvenAppBridge();
    log('Bridge OK');
    bridge.onEvenHubEvent(handleEvent);
    await initGlasses();
    await bootSequence();
  } catch (e) {
    log('Bridge fail: ' + e.message);
  }
}

// ── Boot ──────────────────────────────────────────────────
async function bootSequence() {
  mode = 'boot';
  if (glassesReady) {
    await pushHeader('Alita');
    await pushResponse('Starting.');
    await new Promise(r => setTimeout(r, 800));
    await pushResponse('Starting..');
    await new Promise(r => setTimeout(r, 800));
    await pushResponse('Starting...');
    await new Promise(r => setTimeout(r, 600));
  }
  await fetchSessionInfo();
  showStartScreen();
}

async function fetchSessionInfo() {
  try {
    const res = await fetch(API_BASE + '/session-info');
    if (res.ok) sessionInfo = await res.json();
  } catch {}
}

// ── Start Screen ──────────────────────────────────────────────
async function showStartScreen() {
  mode = 'start';
  startSelectedIndex = 0;
  await rebuildForStart();
  renderStart();
}

async function renderStart() {
  const hint = sessionInfo?.lastTopic || '';
  const lines = [
    "Hi, I'm Alita",
    '',
    startSelectedIndex === 0 ? '> Continue' : '  Continue',
    hint ? '  ' + hint.slice(0, 40) : '',
    '',
    startSelectedIndex === 1 ? '> New conversation' : '  New conversation',
  ].join('\n');

  await pushHeader('Alita');
  await pushResponse(lines);
}

// ── Chat ──────────────────────────────────────────────────
async function startChat(continueSession) {
  mode = 'chat';

  if (continueSession) {
    await pushResponse('Loading...');
    try {
      const res = await fetch(API_BASE + '/continue');
      if (res.ok) {
        const d = await res.json();
        conversationHistory = d.history || [];
        await showText(d.summary || 'Ready.');
        loadReplies(d.replies);
      } else {
        await showText('Ready.');
        defaultReplies();
      }
    } catch {
      await showText('Ready.');
      defaultReplies();
    }
  } else {
    await showText('New conversation.');
    defaultReplies();
  }

  // Build list container with replies
  await pushReplyList();
}

function defaultReplies() {
  replies = [
    { text: 'Speak', action: 'speak' },
    { text: 'What can you do?', action: 'text', value: 'What can you do?' },
    { text: 'What time is it?', action: 'text', value: 'What time is it?' },
    { text: 'Calendar', action: 'text', value: "What's on my calendar?" },
    { text: 'Help', action: 'text', value: 'Help me with something' },
  ];
  selectedIndex = 0;
}

function loadReplies(dataReplies) {
  if (dataReplies?.length > 0) {
    replies = [
      { text: 'Speak', action: 'speak' },
      ...dataReplies.map(r => ({ text: r, action: 'text', value: r })),
    ];
  } else {
    defaultReplies();
  }
  selectedIndex = 0;
}

async function showText(text) {
  let t = text || '';
  if (t.length > MAX_CHARS) t = t.slice(0, MAX_CHARS) + '...';
  await pushResponse(t);
}

// ── Events ──────────────────────────────────────────────────
function handleEvent(event) {
  log('Event: ' + JSON.stringify(event.sysEvent?.eventType || event.listEvent?.eventType || 'other'));

  // List container events (reply selection in chat mode)
  if (event.listEvent && mode === 'chat') {
    const { currentSelectItemIndex, eventType } = event.listEvent;
    selectedIndex = currentSelectItemIndex;
    if (eventType === 'click' || eventType === 'tap') {
      doReplySelect();
    }
    return;
  }

  // System events (touchpad / ring)
  if (event.sysEvent) {
    const et = event.sysEvent.eventType;

    if (mode === 'start') {
      if (et === 'swipe_up') {
        startSelectedIndex = Math.max(0, startSelectedIndex - 1);
        renderStart();
      } else if (et === 'swipe_down') {
        startSelectedIndex = Math.min(1, startSelectedIndex + 1);
        renderStart();
      } else if (et === 'tap' || et === 'press' || et === 'click') {
        doStartSelect();
      }
      return;
    }

    if (mode === 'chat') {
      if (et === 'swipe_up') {
        selectedIndex = Math.max(0, selectedIndex - 1);
        pushReplyList();
      } else if (et === 'swipe_down') {
        selectedIndex = Math.min(replies.length - 1, selectedIndex + 1);
        pushReplyList();
      } else if (et === 'tap' || et === 'press' || et === 'click') {
        doReplySelect();
      }
    }
  }
}

function doStartSelect() {
  startChat(startSelectedIndex === 0);
}

function doReplySelect() {
  if (isProcessing) return;
  const reply = replies[selectedIndex];
  if (!reply) return;
  if (reply.action === 'speak') startListening();
  else if (reply.action === 'text') sendMessage(reply.value || reply.text);
}

// ── Voice ──────────────────────────────────────────────────
async function startListening() {
  if (!bridge) return;
  await showText('[ Listening... ]');
  try {
    await bridge.audioControl(true, AudioInputSource.Glasses);
    const chunks = [];
    const unsub = bridge.onEvenHubEvent(e => {
      if (e.audioEvent?.audioPcm) chunks.push(e.audioEvent.audioPcm);
    });
    setTimeout(async () => {
      unsub();
      await bridge.audioControl(false);
      if (chunks.length > 0) {
        const len = chunks.reduce((s, c) => s + c.length, 0);
        const buf = new Uint8Array(len);
        let off = 0;
        for (const c of chunks) { buf.set(c, off); off += c.length; }
        sendAudio(buf);
      } else {
        await showText('No audio.');
      }
    }, 10000);
  } catch (e) {
    await showText('MIC error.');
  }
}

// ── API ──────────────────────────────────────────────────
async function sendMessage(text) {
  if (isProcessing) return;
  isProcessing = true;
  await showText('Thinking...');
  conversationHistory.push({ role: 'user', content: text });

  try {
    const res = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: conversationHistory.slice(-10) }),
    });
    if (!res.ok) throw new Error('API ' + res.status);
    const data = await res.json();
    conversationHistory.push({ role: 'assistant', content: data.response });
    await showText(data.response);
    loadReplies(data.replies);
    await pushReplyList();
  } catch (e) {
    await showText('Error: ' + e.message);
  } finally {
    isProcessing = false;
  }
}

async function sendAudio(audioData) {
  if (isProcessing) return;
  isProcessing = true;
  try {
    const res = await fetch(API_BASE + '/transcribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: audioData,
    });
    if (!res.ok) throw new Error('Transcribe ' + res.status);
    const data = await res.json();
    if (data.text) sendMessage(data.text);
    else { await showText('No speech.'); isProcessing = false; }
  } catch {
    await showText('Transcribe error.');
    isProcessing = false;
  }
}

init();
</script>
</body>
</html>
